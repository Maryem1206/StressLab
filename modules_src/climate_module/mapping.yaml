# mapping.yaml
# Clé   : nom EXACT de la variable NGFS (copiez-collez depuis l'output)
# Valeur : nom EXACT de votre colonne historique

"Gross Domestic Product (GDP)": "Real_ GDP"
"Unemployment rate ; %": "Unemployment _rate"
"Inflation rate ; %": "cpi_inflation"
"Central bank Intervention rate (policy interest rate) ; %": "policy_rate"
"Long term interest rate ; %": "policy_rate"
"Long term real interest rate ; %": "policy_rate"
"Effective exchange rate": "real_effectif_exchange_rate"
"Exchange rate ; domestic per US$": "exchange_rate_buy"
"Oil price ; US$ per barrel": "oil_price"
"Gas price ; US$ per barrel (equiv)": "oil_price"
"Coal price ; US$ per barrel (equiv)": "oil_price"
"House prices (residential)": "real_estate_price"
